<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <body>
    <!--
      signup.html — 회원가입 폼 fragment.
      layout.html 의 ${contentFragment} 슬롯에 삽입된다.
      Controller 에서 Model 에 signupForm 과 contentFragment 를 담아 layout 을 렌더.
    -->
    <div th:fragment="content" style="display: flex; flex-direction: column; gap: 24px;">
      <h2 style="font-size: var(--dx-font-size-h3); margin: 0;">가입하기</h2>

      <form th:action="@{/signup}" th:object="${signupForm}" method="post"
            style="display: flex; flex-direction: column; gap: 16px;">

        <ds-form-field>
          <ds-label html-for="email" required>이메일</ds-label>
          <ds-input id="email" type="email"
                    th:field="*{email}"
                    placeholder="name@company.com"></ds-input>
          <ds-helper-text>회사 이메일을 입력하세요</ds-helper-text>
          <ds-error-message th:if="${#fields.hasErrors('email')}"
                            th:errors="*{email}"></ds-error-message>
        </ds-form-field>

        <ds-form-field>
          <ds-label html-for="password" required>비밀번호</ds-label>
          <ds-input id="password" type="password" th:field="*{password}"></ds-input>
          <ds-error-message th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}"></ds-error-message>
        </ds-form-field>

        <ds-form-field orientation="horizontal">
          <ds-checkbox id="terms" th:field="*{terms}"></ds-checkbox>
          <ds-label html-for="terms">이용약관에 동의합니다</ds-label>
        </ds-form-field>

        <ds-button type="submit" variant="primary">가입하기</ds-button>
      </form>

      <!--
        Tailwind 오버라이드 섹션.
        Thymeleaf 는 서버 렌더이므로 class 는 속성 문자열로 조립한다.
        - 정적: class="w-full"
        - 조건부: th:classappend="${condition} ? 'rounded-full shadow-lg'"
        - 완전 동적: th:class="|base-class ${variant}|"  (Thymeleaf literal substitution)
        React 의 cn() 같은 병합 로직이 필요하면 Thymeleaf #strings.concat 또는 유틸 객체 사용.
      -->
      <section style="margin-top: 32px;">
        <h3>Tailwind 오버라이드</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 정적 class -->
          <ds-button variant="primary" class="w-full">w-full</ds-button>

          <!-- 조건부: hasError 면 추가 클래스 -->
          <ds-button variant="primary"
                     class="w-full"
                     th:classappend="${hasError} ? 'ring-2 ring-red-500'">
            조건부 class
          </ds-button>

          <!-- Model 값으로 class 동적 구성 -->
          <ds-button variant="primary"
                     th:class="|w-full ${buttonSize ?: 'mt-0'}|">
            동적 class
          </ds-button>

          <!-- Shoelace variant 도 Model 에서 -->
          <ds-button th:variant="${isPrimary ? 'primary' : 'secondary'}"
                     class="w-auto ml-auto">
            동적 variant
          </ds-button>
        </div>
      </section>
    </div>
  </body>
</html>
