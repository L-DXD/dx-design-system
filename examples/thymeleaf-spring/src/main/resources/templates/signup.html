<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <body>
    <!--
      signup.html — 회원가입 폼 fragment.
      layout.html 의 ${contentFragment} 슬롯에 삽입.

      !! 중요 !!
      Thymeleaf 의 th:field 는 <input>/<select>/<textarea> 에만 작동.
      <ds-input> 은 custom element 이므로 th:field 가 fallthrough 해 오동작한다.
      따라서 th:attr / th:text / th:value 등으로 개별 속성을 명시적으로 부여한다.
    -->
    <div th:fragment="content">
      <!-- 1. 기본 폼 -->
      <section class="flex flex-col gap-4 p-6 rounded-xl border">
        <h2 class="text-xl font-semibold">1. 기본 사용</h2>

        <form th:action="@{/signup}" th:object="${signupForm}" method="post"
              class="flex flex-col gap-4">

          <div class="flex flex-col gap-2">
            <ds-label for="email" th:text="#{form.email.label}">이메일</ds-label>
            <ds-input id="email"
                      name="email"
                      type="email"
                      placeholder="name@company.com"
                      th:value="*{email}"/>
            <ds-helper-text th:text="#{form.email.helper}">회사 이메일을 입력하세요</ds-helper-text>
            <ds-error-message th:if="${#fields.hasErrors('email')}"
                              th:errors="*{email}"></ds-error-message>
          </div>

          <div class="flex flex-col gap-2">
            <ds-label for="password">비밀번호</ds-label>
            <ds-input id="password"
                      name="password"
                      type="password"
                      th:value="*{password}"/>
            <ds-error-message th:if="${#fields.hasErrors('password')}"
                              th:errors="*{password}"></ds-error-message>
          </div>

          <div class="flex flex-row items-center gap-2">
            <!-- ds-checkbox 는 없음 (Radix 의존). native input 사용. -->
            <input type="checkbox"
                   id="terms"
                   name="terms"
                   class="size-4 rounded border-input"
                   th:checked="*{terms}"/>
            <ds-label for="terms">이용약관에 동의합니다</ds-label>
          </div>

          <ds-button type="submit" th:text="#{form.submit}">가입하기</ds-button>
        </form>
      </section>

      <!-- 2. Token 오버라이드 -->
      <section class="flex flex-col gap-4 p-6 rounded-xl border">
        <h2 class="text-xl font-semibold">2. Token 오버라이드</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="flex flex-col gap-3 p-4 rounded-lg border">
            <ds-badge>기본</ds-badge>
            <ds-button>가입</ds-button>
          </div>
          <div class="flex flex-col gap-3 p-4 rounded-lg border"
               style="--primary:#8b5cf6; --ring:#8b5cf6;">
            <ds-badge>Purple</ds-badge>
            <ds-button>가입</ds-button>
          </div>
          <div class="flex flex-col gap-3 p-4 rounded-lg border"
               style="--primary:#10b981; --ring:#10b981;">
            <ds-badge>Emerald</ds-badge>
            <ds-button>가입</ds-button>
          </div>
        </div>
      </section>

      <!-- 3. Tailwind 오버라이드 -->
      <section class="flex flex-col gap-4 p-6 rounded-xl border">
        <h2 class="text-xl font-semibold">3. Tailwind 오버라이드</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <ds-button>default</ds-button>
          <ds-button variant="secondary">secondary</ds-button>
          <ds-button variant="tertiary">tertiary</ds-button>
          <ds-button variant="destructive">destructive</ds-button>
          <!-- 조건부 class 예 -->
          <ds-button class="w-full"
                     th:classappend="${hasError} ? 'ring-2 ring-destructive'">
            조건부 class
          </ds-button>
          <!-- 동적 class 예 -->
          <ds-button th:class="|w-full ${buttonSize ?: 'mt-0'}|">동적 class</ds-button>
        </div>
      </section>

      <!-- 4. Dialog (Alpine.js) -->
      <section class="flex flex-col gap-4 p-6 rounded-xl border"
               x-data="{ open: false }">
        <h2 class="text-xl font-semibold">4. Dialog (Alpine.js)</h2>
        <ds-button x-on:click="open = true" th:text="#{form.terms.view}">약관 보기</ds-button>
        <ds-dialog x-show="open" x-on:dialog-close="open = false"
                   class="flex flex-col gap-3">
          <h3 class="text-lg font-semibold" th:text="#{form.terms.title}">이용약관</h3>
          <p class="text-sm" th:text="#{form.terms.body}">본문...</p>
          <ds-button variant="outline" x-on:click="open = false">닫기</ds-button>
        </ds-dialog>
      </section>
    </div>
  </body>
</html>
