<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko" th:attr="data-theme=${userTheme ?: 'light'}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} ?: 'DX Design System'">DX Design System</title>

    <!-- @dx/styles 로드. 사내 Tailwind 빌드가 있으면 자기 빌드물로 교체, 없으면 styles-utilities.css -->
    <link rel="stylesheet" th:href="@{/css/styles-utilities.css}" />

    <!-- Alpine.js (Dialog 등 인터랙션 필요 시) -->
    <script defer src="https://unpkg.com/alpinejs@3"></script>

    <!-- @dx/elements Light DOM Web Components -->
    <script type="module" defer th:src="@{/js/dx-elements.mjs}"></script>
  </head>

  <body class="bg-background text-foreground p-10">
    <main class="max-w-2xl mx-auto flex flex-col gap-8">
      <header>
        <h1 class="text-3xl font-bold">DX Design System</h1>
        <p class="text-muted-foreground mt-2">Thymeleaf + Spring Boot 예제</p>
      </header>

      <div th:replace="${contentFragment}">
        <!-- 각 페이지 fragment 가 삽입됨 -->
      </div>
    </main>
  </body>
</html>
